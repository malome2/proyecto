<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 620" font-family="'Segoe UI',Arial,sans-serif">

  <!-- White background -->
  <rect width="860" height="620" fill="white"/>

  <!-- Title -->
  <text x="430" y="18" text-anchor="middle" font-size="11" font-weight="bold" fill="#111">Wireframe — login.html</text>

  <!-- Page frame -->
  <rect x="20" y="26" width="820" height="586" fill="#f5f5f5" stroke="#111" stroke-width="1.5"/>

  <!-- Dark full-page background -->
  <rect x="20" y="26" width="820" height="586" fill="#e8e8e8"/>

  <!-- ── LOGO / BRAND ── -->
  <rect x="330" y="50" width="200" height="36" rx="5" fill="white" stroke="#111" stroke-width="1.5"/>
  <text x="430" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">MUSEU VIRTUAL</text>
  <text x="430" y="100" text-anchor="middle" font-size="8.5" fill="#666">Inicia sessió per accedir al museu</text>

  <!-- ── TAB SWITCHER ── -->
  <rect x="240" y="110" width="380" height="34" rx="6" fill="white" stroke="#111" stroke-width="1.2"/>
  <!-- Active tab -->
  <rect x="244" y="113" width="90" height="27" rx="5" fill="#111"/>
  <text x="289" y="131" text-anchor="middle" font-size="9" font-weight="bold" fill="white">Inicia sessió</text>
  <!-- Inactive tabs -->
  <text x="382" y="131" text-anchor="middle" font-size="9" fill="#666">Registra't</text>
  <text x="476" y="131" text-anchor="middle" font-size="9" fill="#666">Verifica</text>
  <text x="566" y="131" text-anchor="middle" font-size="9" fill="#666">Recupera</text>

  <!-- ── LOGIN CARD ── -->
  <rect x="270" y="154" width="320" height="270" rx="6" fill="white" stroke="#111" stroke-width="1.5"/>

  <!-- Email label + field -->
  <text x="290" y="178" font-size="9" fill="#333">Correu electrònic</text>
  <rect x="290" y="184" width="280" height="30" rx="4" fill="white" stroke="#888" stroke-width="1"/>
  <text x="302" y="204" font-size="9" fill="#bbb">usuari@exemple.com</text>

  <!-- Password label + field -->
  <text x="290" y="232" font-size="9" fill="#333">Contrasenya</text>
  <rect x="290" y="238" width="280" height="30" rx="4" fill="white" stroke="#888" stroke-width="1"/>
  <text x="302" y="258" font-size="9" fill="#bbb">••••••••</text>
  <!-- Eye icon -->
  <text x="556" y="258" text-anchor="end" font-size="11" fill="#888">👁</text>

  <!-- Password requirements hint -->
  <text x="290" y="284" font-size="7.5" fill="#aaa">8+ caràcters · majúscula · minúscula · número</text>

  <!-- Submit button -->
  <rect x="290" y="294" width="280" height="34" rx="5" fill="#111"/>
  <text x="430" y="316" text-anchor="middle" font-size="10" font-weight="bold" fill="white">Inicia sessió</text>

  <!-- Forgot password -->
  <text x="430" y="350" text-anchor="middle" font-size="8.5" fill="#555" text-decoration="underline">Has oblidat la contrasenya?</text>

  <!-- Divider -->
  <line x1="290" y1="368" x2="408" y2="368" stroke="#ccc" stroke-width="1"/>
  <text x="430" y="373" text-anchor="middle" font-size="8" fill="#aaa">o</text>
  <line x1="452" y1="368" x2="570" y2="368" stroke="#ccc" stroke-width="1"/>

  <!-- Switch link -->
  <text x="430" y="394" text-anchor="middle" font-size="8.5" fill="#555">No tens compte?  <tspan font-weight="bold" fill="#111">Registra't</tspan></text>
  <text x="430" y="410" text-anchor="middle" font-size="8.5" fill="#555">Ja tens compte?  <tspan font-weight="bold" fill="#111">Inicia sessió</tspan></text>

  <!-- ── OTP VERIFICATION PANEL (shown on "Verifica" tab) ── -->
  <rect x="270" y="446" width="320" height="150" rx="6" fill="white" stroke="#111" stroke-width="1.2"/>
  <text x="430" y="470" text-anchor="middle" font-size="10" font-weight="bold" fill="#111">Verificació del compte</text>
  <text x="430" y="488" text-anchor="middle" font-size="8.5" fill="#555">Introdueix el codi de 6 dígits enviat per correu</text>

  <!-- 6 OTP boxes -->
  <rect x="290" y="498" width="34" height="38" rx="4" fill="white" stroke="#888" stroke-width="1.2"/>
  <rect x="332" y="498" width="34" height="38" rx="4" fill="white" stroke="#888" stroke-width="1.2"/>
  <rect x="374" y="498" width="34" height="38" rx="4" fill="white" stroke="#888" stroke-width="1.2"/>
  <rect x="416" y="498" width="34" height="38" rx="4" fill="white" stroke="#111" stroke-width="2"/>
  <rect x="458" y="498" width="34" height="38" rx="4" fill="white" stroke="#888" stroke-width="1.2"/>
  <rect x="500" y="498" width="34" height="38" rx="4" fill="white" stroke="#888" stroke-width="1.2"/>
  <!-- Sample digits -->
  <text x="307" y="522" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">4</text>
  <text x="349" y="522" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">2</text>
  <text x="391" y="522" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">7</text>
  <text x="433" y="522" text-anchor="middle" font-size="16" fill="#bbb">|</text>
  <text x="475" y="522" text-anchor="middle" font-size="16" fill="#bbb">_</text>
  <text x="517" y="522" text-anchor="middle" font-size="16" fill="#bbb">_</text>

  <text x="430" y="550" text-anchor="middle" font-size="7.5" fill="#999">1 dígit per caixa · auto-avança al seguent</text>

  <!-- Verify button -->
  <rect x="310" y="556" width="240" height="28" rx="5" fill="#111"/>
  <text x="430" y="575" text-anchor="middle" font-size="9" font-weight="bold" fill="white">Verificar compte</text>
  <text x="430" y="590" text-anchor="middle" font-size="8" fill="#888">No has rebut el codi?  <tspan fill="#111" text-decoration="underline">Reenviar</tspan></text>

  <!-- Annotation -->
  <text x="430" y="608" text-anchor="middle" font-size="8" fill="#999" font-style="italic">Cada tab mostra el seu formulari corresponent; els altres queden ocults</text>

</svg>
