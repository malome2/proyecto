<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 620" font-family="'Segoe UI',Arial,sans-serif">

  <!-- White background -->
  <rect width="860" height="620" fill="white"/>

  <!-- Title -->
  <text x="430" y="18" text-anchor="middle" font-size="11" font-weight="bold" fill="#111">Wireframe — index.html</text>

  <!-- Page frame -->
  <rect x="20" y="26" width="820" height="586" fill="white" stroke="#111" stroke-width="1.5"/>

  <!-- ── NAVBAR ── -->
  <rect x="20" y="26" width="820" height="40" fill="#111"/>
  <!-- Logo placeholder -->
  <rect x="32" y="34" width="44" height="24" rx="2" fill="none" stroke="white" stroke-width="1"/>
  <text x="54" y="50" text-anchor="middle" font-size="8" fill="white">LOGO</text>
  <!-- Nav links -->
  <text x="170" y="51" text-anchor="middle" font-size="9" fill="white">Inici</text>
  <text x="240" y="51" text-anchor="middle" font-size="9" fill="white">Museu 3D</text>
  <text x="320" y="51" text-anchor="middle" font-size="9" fill="white">Qui som</text>
  <text x="400" y="51" text-anchor="middle" font-size="9" fill="white">Donació</text>
  <!-- Auth buttons (right) -->
  <rect x="680" y="33" width="64" height="22" rx="11" fill="white"/>
  <text x="712" y="48" text-anchor="middle" font-size="8.5" fill="#111" font-weight="bold">Entrar</text>
  <rect x="754" y="33" width="72" height="22" rx="11" fill="none" stroke="white" stroke-width="1.2"/>
  <text x="790" y="48" text-anchor="middle" font-size="8.5" fill="white">Registrar-se</text>

  <!-- ── HERO ── -->
  <rect x="20" y="66" width="820" height="90" fill="#f0f0f0" stroke="#111" stroke-width="1"/>
  <text x="430" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">Museu Virtual de Videojocs</text>
  <text x="430" y="118" text-anchor="middle" font-size="10" fill="#444">Explora la història dels videojocs en un entorn 3D immersiu</text>
  <rect x="350" y="126" width="160" height="22" rx="11" fill="#111"/>
  <text x="430" y="141" text-anchor="middle" font-size="9" fill="white">Entrar al Museu 3D  →</text>

  <!-- ── GAME COUNT BANNER ── -->
  <rect x="20" y="156" width="820" height="28" fill="white" stroke="#ccc" stroke-width="1"/>
  <text x="430" y="175" text-anchor="middle" font-size="9.5" fill="#444">■  12 jocs disponibles al catàleg</text>

  <!-- ── SECTION HEADER ── -->
  <text x="40" y="204" font-size="12" font-weight="bold" fill="#111">Catàleg de Jocs</text>
  <line x1="40" y1="209" x2="170" y2="209" stroke="#111" stroke-width="1.5"/>

  <!-- ── GAME GRID — 3 × 4 ── -->
  <!-- Row 1 -->
  <rect x="40" y="216" width="240" height="110" rx="3" fill="white" stroke="#111" stroke-width="1"/>
  <rect x="40" y="216" width="240" height="70" fill="#ddd" stroke="#111" stroke-width="1"/>
  <line x1="40" y1="216" x2="280" y2="286" stroke="#bbb" stroke-width="0.7"/>
