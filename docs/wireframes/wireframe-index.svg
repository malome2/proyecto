  <text x="430" y="310" text-anchor="middle" font-size="9" font-weight="bold" fill="#111">Títol del joc</text>
  <text x="430" y="322" text-anchor="middle" font-size="8" fill="#666">Any · Gènere</text>

  <rect x="580" y="216" width="240" height="110" rx="3" fill="white" stroke="#111" stroke-width="1"/>
  <rect x="580" y="216" width="240" height="70" fill="#ddd" stroke="#111" stroke-width="1"/>
  <line x1="580" y1="216" x2="820" y2="286" stroke="#bbb" stroke-width="0.7"/>
  <line x1="820" y1="216" x2="580" y2="286" stroke="#bbb" stroke-width="0.7"/>
  <text x="700" y="310" text-anchor="middle" font-size="9" font-weight="bold" fill="#111">Títol del joc</text>
  <text x="700" y="322" text-anchor="middle" font-size="8" fill="#666">Any · Gènere</text>

  <!-- Row 2 -->
  <rect x="40" y="334" width="240" height="110" rx="3" fill="white" stroke="#111" stroke-width="1"/>
  <rect x="40" y="334" width="240" height="70" fill="#ddd" stroke="#111" stroke-width="1"/>
  <line x1="40" y1="334" x2="280" y2="404" stroke="#bbb" stroke-width="0.7"/>
  <line x1="280" y1="334" x2="40" y2="404" stroke="#bbb" stroke-width="0.7"/>
  <text x="160" y="428" text-anchor="middle" font-size="9" font-weight="bold" fill="#111">Títol del joc</text>
  <text x="160" y="440" text-anchor="middle" font-size="8" fill="#666">Any · Gènere</text>

  <rect x="310" y="334" width="240" height="110" rx="3" fill="white" stroke="#111" stroke-width="1"/>
  <rect x="310" y="334" width="240" height="70" fill="#ddd" stroke="#111" stroke-width="1"/>
  <line x1="310" y1="334" x2="550" y2="404" stroke="#bbb" stroke-width="0.7"/>
  <line x1="550" y1="334" x2="310" y2="404" stroke="#bbb" stroke-width="0.7"/>
  <text x="430" y="428" text-anchor="middle" font-size="9" font-weight="bold" fill="#111">Títol del joc</text>
  <text x="430" y="440" text-anchor="middle" font-size="8" fill="#666">Any · Gènere</text>

  <rect x="580" y="334" width="240" height="110" rx="3" fill="white" stroke="#111" stroke-width="1"/>
  <rect x="580" y="334" width="240" height="70" fill="#ddd" stroke="#111" stroke-width="1"/>
  <line x1="580" y1="334" x2="820" y2="404" stroke="#bbb" stroke-width="0.7"/>
  <line x1="820" y1="334" x2="580" y2="404" stroke="#bbb" stroke-width="0.7"/>
  <text x="700" y="428" text-anchor="middle" font-size="9" font-weight="bold" fill="#111">Títol del joc</text>
  <text x="700" y="440" text-anchor="middle" font-size="8" fill="#666">Any · Gènere</text>

  <!-- ── RECOMMENDATION SECTION ── -->
  <rect x="40" y="460" width="780" height="100" rx="4" fill="white" stroke="#111" stroke-width="1"/>
  <text x="430" y="482" text-anchor="middle" font-size="11" font-weight="bold" fill="#111">Envia una recomanació</text>
  <text x="430" y="496" text-anchor="middle" font-size="9" fill="#555">Proposa un joc que hauria d'estar al museu</text>
  <!-- Form row -->
  <rect x="60" y="502" width="240" height="24" rx="3" fill="white" stroke="#888" stroke-width="1"/>
  <text x="70" y="518" font-size="8.5" fill="#999">Títol del joc...</text>
  <rect x="316" y="502" width="340" height="24" rx="3" fill="white" stroke="#888" stroke-width="1"/>
  <text x="326" y="518" font-size="8.5" fill="#999">Descripció breu...</text>
  <rect x="670" y="502" width="110" height="24" rx="12" fill="#111"/>
  <text x="725" y="518" text-anchor="middle" font-size="8.5" fill="white" font-weight="bold">Enviar</text>
  <text x="430" y="548" text-anchor="middle" font-size="8" fill="#888">(només per a usuaris autenticats)</text>

  <!-- ── FOOTER ── -->
  <rect x="20" y="592" width="820" height="20" fill="#111"/>
  <text x="430" y="606" text-anchor="middle" font-size="8" fill="#bbb">© 2025 Museu Virtual de Videojocs</text>

</svg>
