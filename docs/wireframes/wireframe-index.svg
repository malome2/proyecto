  <text x="160" y="310" text-anchor="middle" font-size="9" font-weight="bold" fill="#111">Títol del joc</text>
  <text x="160" y="322" text-anchor="middle" font-size="8" fill="#666">Any · Gènere</text>

  <rect x="310" y="216" width="240" height="110" rx="3" fill="white" stroke="#111" stroke-width="1"/>
  <rect x="310" y="216" width="240" height="70" fill="#ddd" stroke="#111" stroke-width="1"/>
  <line x1="310" y1="216" x2="550" y2="286" stroke="#bbb" stroke-width="0.7"/>
