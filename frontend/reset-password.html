<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nueva contraseña — Virtual VideoGame Museum</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/ui.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>
  <div class="login-card">
    <div class="logo">
      <div class="logo-icon"><img src="img/logo.svg" alt="Logo" /></div>
      <div class="logo-text">Virtual <span>VideoGame</span> Museum</div>
    </div>

    <!-- Estado: token inválido -->
    <div id="view-invalid" style="display:none;text-align:center;padding:16px 0">
      <div class="verify-icon"><img src="img/icon4.svg" alt="" style="width:48px;height:48px;object-fit:contain;opacity:0.5" /></div>
      <p class="verify-title">Enlace no válido</p>
      <p class="verify-subtitle">Este enlace ha expirado o ya ha sido utilizado.</p>
      <a href="login.html" class="login-btn" style="display:inline-block;margin-top:20px;text-decoration:none;padding:12px 32px">
        Volver al login
      </a>
    </div>

    <!-- Estado: formulario -->
    <div id="view-form">
      <div class="verify-header">
        <div class="verify-icon"><img src="img/icon4.svg" alt="" style="width:48px;height:48px;object-fit:contain" /></div>
        <p class="verify-title">Nueva contraseña</p>
        <p class="verify-subtitle">Elige una nueva contraseña para tu cuenta.</p>
      </div>

      <div class="login-form-group">
        <label class="login-label" for="new-password">Nueva contraseña</label>
        <input class="login-input" type="password" id="new-password" placeholder="Mínimo 8 caracteres" autocomplete="new-password" />
      </div>
      <div class="login-form-group">
        <label class="login-label" for="confirm-password">Confirmar contraseña</label>
        <input class="login-input" type="password" id="confirm-password" placeholder="Repite la contraseña" autocomplete="new-password" />
      </div>

      <button class="login-btn" id="btn-reset" onclick="handleReset()">Guardar nueva contraseña</button>
      <div class="msg" id="msg-reset"></div>
    </div>

    <!-- Estado: éxito -->
    <div id="view-success" style="display:none;text-align:center;padding:16px 0">
      <div class="verify-icon"><img src="img/icon4.svg" alt="" style="width:48px;height:48px;object-fit:contain" /></div>
      <p class="verify-title">Contraseña actualizada</p>
      <p class="verify-subtitle">Ya puedes iniciar sesión con tu nueva contraseña.</p>
      <a href="login.html" class="login-btn" style="display:inline-block;margin-top:20px;text-decoration:none;padding:12px 32px">
        Iniciar sesión
      </a>
    </div>

    <a href="login.html" class="back-link">&larr; Volver al login</a>
  </div>

  <script src="js/config.js"></script>
  <script>
    const API   = `${API_BASE}/api/auth`;
    const token = new URLSearchParams(window.location.search).get('token');

    if (!token) {
      document.getElementById('view-form').style.display    = 'none';
      document.getElementById('view-invalid').style.display = 'block';
    }

    function showMsg(text, type) {
      const el = document.getElementById('msg-reset');
      el.textContent = text;
      el.className   = 'msg ' + type;
    }

    function validatePassword(p) {
      if (p.length < 8)     return 'La contraseña debe tener al menos 8 caracteres';
      if (!/[A-Z]/.test(p)) return 'Debe incluir al menos una mayúscula';
      if (!/[a-z]/.test(p)) return 'Debe incluir al menos una minúscula';
      if (!/\d/.test(p))    return 'Debe incluir al menos un número';
      return null;
    }

    async function handleReset() {
      const newPassword = document.getElementById('new-password').value;
      const confirm     = document.getElementById('confirm-password').value;
      const btn         = document.getElementById('btn-reset');

      const err = validatePassword(newPassword);
      if (err) { showMsg(err, 'error'); return; }
      if (newPassword !== confirm) { showMsg('Las contraseñas no coinciden', 'error'); return; }

      btn.disabled = true; btn.textContent = 'Guardando...';

      try {
        const res  = await fetch(`${API}/reset-password`, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ token, newPassword })
        });
        const data = await res.json();

        if (res.ok) {
          document.getElementById('view-form').style.display    = 'none';
          document.getElementById('view-success').style.display = 'block';
        } else {
          showMsg(data.error || 'Error al restablecer la contraseña', 'error');
          if (data.error && data.error.includes('expirado')) {
            setTimeout(() => {
              document.getElementById('view-form').style.display    = 'none';
              document.getElementById('view-invalid').style.display = 'block';
            }, 2000);
          }
          btn.disabled = false; btn.textContent = 'Guardar nueva contraseña';
        }
      } catch {
        showMsg('No se pudo conectar con el servidor', 'error');
        btn.disabled = false; btn.textContent = 'Guardar nueva contraseña';
      }
    }
  </script>
</body>
</html>
