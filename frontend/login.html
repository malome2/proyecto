<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Museo de Videojuegos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0d1a;
      font-family: 'Segoe UI', sans-serif;
      color: #e0e0e0;
    }

    .card {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 12px;
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    h1 {
      text-align: center;
      font-size: 1.6rem;
      margin-bottom: 8px;
      color: #c084fc;
    }

    .subtitle {
      text-align: center;
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 28px;
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid #2a2a4a;
      margin-bottom: 28px;
    }

    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      font-size: 0.9rem;
      color: #888;
      border-bottom: 2px solid transparent;
      transition: color 0.2s, border-color 0.2s;
    }

    .tab.active {
      color: #c084fc;
      border-bottom-color: #c084fc;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: #aaa;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 10px 14px;
      background: #0d0d1a;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #c084fc;
    }

    button[type="submit"] {
      width: 100%;
      padding: 12px;
      background: #7c3aed;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }

    button[type="submit"]:hover {
      background: #6d28d9;
    }

    button[type="submit"]:disabled {
      background: #4a4a6a;
      cursor: not-allowed;
    }

    .msg {
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.87rem;
      text-align: center;
      display: none;
    }

    .msg.error { background: #3b0a0a; color: #f87171; display: block; }
    .msg.success { background: #052e16; color: #4ade80; display: block; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎮 Museo de Videojuegos</h1>
    <p class="subtitle">Accede a tu cuenta para continuar</p>

    <div class="tabs">
      <div class="tab active" id="tab-login" onclick="switchTab('login')">Iniciar sesión</div>
      <div class="tab" id="tab-register" onclick="switchTab('register')">Registrarse</div>
    </div>

    <!-- Login form -->
    <form id="form-login" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" placeholder="tu@email.com" required />
      </div>
      <div class="form-group">
        <label for="login-password">Contraseña</label>
        <input type="password" id="login-password" placeholder="••••••••" required />
      </div>
      <button type="submit" id="btn-login">Entrar</button>
      <div class="msg" id="msg-login"></div>
    </form>

    <!-- Register form -->
    <form id="form-register" onsubmit="handleRegister(event)" style="display:none">
      <div class="form-group">
        <label for="reg-username">Nombre de usuario</label>
        <input type="text" id="reg-username" placeholder="jugador123" required />
      </div>
      <div class="form-group">
        <label for="reg-email">Email</label>
        <input type="email" id="reg-email" placeholder="tu@email.com" required />
      </div>
      <div class="form-group">
        <label for="reg-password">Contraseña</label>
        <input type="password" id="reg-password" placeholder="Mínimo 6 caracteres" minlength="6" required />
      </div>
      <button type="submit" id="btn-register">Crear cuenta</button>
      <div class="msg" id="msg-register"></div>
    </form>
  </div>

  <script>
    const API = 'http://localhost:3000/api/auth';

    function switchTab(tab) {
      document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('form-register').style.display = tab === 'register' ? 'block' : 'none';
      document.getElementById('tab-login').classList.toggle('active', tab === 'login');
      document.getElementById('tab-register').classList.toggle('active', tab === 'register');
    }

    function showMsg(id, text, type) {
      const el = document.getElementById(id);
      el.textContent = text;
      el.className = 'msg ' + type;
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-login');
      btn.disabled = true;
      btn.textContent = 'Entrando...';

      try {
        const res = await fetch(`${API}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('login-email').value,
            password: document.getElementById('login-password').value
          })
        });

        const data = await res.json();

        if (!res.ok) {
          showMsg('msg-login', data.error || 'Error al iniciar sesión', 'error');
        } else {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          showMsg('msg-login', '¡Bienvenido ' + data.user.username + '!', 'success');
          setTimeout(() => {
            window.location.href = data.user.role === 'ADMIN' ? 'admin.html' : 'museo.html';
          }, 800);
        }
      } catch {
        showMsg('msg-login', 'No se pudo conectar con el servidor', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-register');
      btn.disabled = true;
      btn.textContent = 'Creando cuenta...';

      try {
        const res = await fetch(`${API}/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('reg-username').value,
            email: document.getElementById('reg-email').value,
            password: document.getElementById('reg-password').value
          })
        });

        const data = await res.json();

        if (!res.ok) {
          showMsg('msg-register', data.error || 'Error al registrarse', 'error');
        } else {
          showMsg('msg-register', 'Cuenta creada. Ahora puedes iniciar sesión.', 'success');
          setTimeout(() => switchTab('login'), 1500);
        }
      } catch {
        showMsg('msg-register', 'No se pudo conectar con el servidor', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Crear cuenta';
      }
    }

    // Redirect if already logged in
    if (localStorage.getItem('token')) {
      const user = JSON.parse(localStorage.getItem('user') || '{}');
      window.location.href = user.role === 'ADMIN' ? 'admin.html' : 'museo.html';
    }
  </script>
</body>
</html>
