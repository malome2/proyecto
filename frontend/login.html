<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Museo de Videojuegos</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/ui.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>
  <div class="login-card">
    <div class="logo">
      <div class="logo-icon"><img src="img/logo.svg" alt="Logo" /></div>
      <div class="logo-text">MUSEO<span>VG</span></div>
    </div>
    <p class="login-subtitle">Accede a tu cuenta para explorar el museo</p>

    <div class="tabs">
      <div class="tab active" id="tab-login" onclick="switchTab('login')">Iniciar sesión</div>
      <div class="tab" id="tab-register" onclick="switchTab('register')">Crear cuenta</div>
    </div>

    <!-- Login form -->
    <form id="form-login" onsubmit="handleLogin(event)">
      <div class="login-form-group">
        <label class="login-label" for="login-email">Email</label>
        <input class="login-input" type="email" id="login-email" placeholder="tu@email.com" required />
      </div>
      <div class="login-form-group">
        <label class="login-label" for="login-password">Contraseña</label>
        <input class="login-input" type="password" id="login-password" placeholder="••••••••" required />
      </div>
      <button type="submit" class="login-btn" id="btn-login">Entrar</button>
      <div class="msg" id="msg-login"></div>
    </form>

    <!-- Register form -->
    <form id="form-register" onsubmit="handleRegister(event)" style="display:none">
      <div class="login-form-group">
        <label class="login-label" for="reg-username">Nombre de usuario</label>
        <input class="login-input" type="text" id="reg-username" placeholder="jugador123" required />
      </div>
      <div class="login-form-group">
        <label class="login-label" for="reg-email">Email</label>
        <input class="login-input" type="email" id="reg-email" placeholder="tu@email.com" required />
      </div>
      <div class="login-form-group">
        <label class="login-label" for="reg-password">Contraseña</label>
        <input class="login-input" type="password" id="reg-password" placeholder="Mínimo 6 caracteres" minlength="6" required />
      </div>
      <button type="submit" class="login-btn" id="btn-register">Crear cuenta</button>
      <div class="msg" id="msg-register"></div>
    </form>

    <a href="index.html" class="back-link">&larr; Volver al inicio</a>
  </div>

  <script src="js/config.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
