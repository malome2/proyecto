<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="img/logo.svg" />
  <title>Donacion completada — Virtual VideoGame Museum</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/nav.css" />
  <link rel="stylesheet" href="css/ui.css" />
</head>
<body>
<div class="page-wrapper">

  <section class="section">
    <div class="container-narrow" style="text-align:center;padding-top:48px">

      <div style="width:140px;height:140px;margin:0 auto 32px">
        <img src="img/icon2.svg" alt="" style="width:100%;height:100%;object-fit:contain" />
      </div>

      <div class="section-label" style="display:block">Pago completado</div>
      <h1 class="section-title" style="margin-top:10px" id="titulo-gracias">Gracias por tu donacion</h1>
      <p class="section-subtitle" style="margin:0 auto 16px" id="subtitulo-gracias">
        Tu aportacion ayuda a mantener el museo activo y a seguir ampliando la coleccion. Te lo agradecemos mucho.
      </p>
      <p id="msg-tier" style="font-size:0.85rem;color:var(--accent);margin-bottom:40px;display:none"></p>

      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
        <a href="museo.html" class="btn btn-primary">Explorar el museo</a>
        <a href="support.html" class="btn btn-outline">Volver a Apoyanos</a>
      </div>

    </div>
  </section>

</div>

<script src="js/config.js"></script>
<script src="js/nav.js"></script>
<script>
  renderNav('support');

  const params    = new URLSearchParams(window.location.search);
  const sessionId = params.get('session_id');
  const amount    = params.get('amount');

  if (amount) {
    document.getElementById('titulo-gracias').textContent = `Gracias por tu donacion de ${amount}€`;
  }

  async function confirmarPago() {
    if (!sessionId) return;

    const token   = localStorage.getItem('token');
    const headers = { 'Content-Type': 'application/json' };
    if (token) headers['Authorization'] = `Bearer ${token}`;

    try {
      const res  = await fetch(`${API_BASE}/api/pagos/confirmar`, {
        method:  'POST',
        headers,
        body:    JSON.stringify({ sessionId })
      });
      const data = await res.json();

      if (res.ok && data.tier && data.tier !== 'visitante') {
        const msgEl = document.getElementById('msg-tier');
        msgEl.style.display = 'block';
        msgEl.textContent = 'Tus recomendaciones tienen prioridad en el panel de administracion.';
      }
    } catch {}
  }

  confirmarPago();
</script>
</body>
</html>
